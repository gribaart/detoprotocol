version: '3.8'

services:
  # Local Ollama service (if running in container)
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 5s
      timeout: 3s
      retries: 5

  # AI Gateway (private)
  gateway:
    build:
      context: ./ai-gateway-private
      dockerfile: Dockerfile
    container_name: ai-gateway
    ports:
      - "8080:8080"
    environment:
      - GATEWAY_PORT=8080
    depends_on:
      - ollama
    networks:
      - deto-network

  # AI Worker (public, thin Go client)
  worker:
    build:
      context: ./ai-worker-public
      dockerfile: Dockerfile
    container_name: ai-worker
    environment:
      - GATEWAY_URL=ws://gateway:8080/ws/worker
      - OLLAMA_URL=http://ollama:11434
    depends_on:
      - gateway
      - ollama
    networks:
      - deto-network

volumes:
  ollama_data:
    driver: local

networks:
  deto-network:
    driver: bridge
